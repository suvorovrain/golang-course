services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-monitoring-app
    ports:
      - "8081:8081"
    environment:
      APP_PORT: "8081"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: demo-prometheus
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: demo-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
